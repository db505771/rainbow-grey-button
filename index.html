<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dark Gray Button with Border</title>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden;
    }

    .dark-gray-button {
      width: 100%;
      height: 100%;
      box-sizing: border-box;

      appearance: none;
      -webkit-appearance: none;
      outline: none;
      padding: 0;
      margin: 0;
      display: block;
      cursor: pointer;

      /* Smooth rounded corners */
      border-radius: 22px;

      /* Solid Dark Gray Background */
      background-color: #1f2937;

      /* Solid Mid-Gray Border */
      border: 2px solid #6b7280;

      box-shadow: none;

      /* Touch Feedback */
      transition: transform 0.12s ease, background-color 0.12s ease, border-color 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* Slightly darkens surface & brightens border on press for touch feedback */
    .dark-gray-button:active {
      transform: scale(0.985);
      background-color: #111827;
      border-color: #9ca3af;
    }

    .dark-gray-button:focus {
      outline: none;
    }
  </style>
</head>
<body>

  <button class="dark-gray-button" type="button" onclick="buttonPressed()"></button>

  <script>
    function buttonPressed() {
      // Your action here
    }
  </script>
</body>
</html>
