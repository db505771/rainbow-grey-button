<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Near Black Button with Thin Border</title>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden;
    }

    .dark-gray-button {
      width: 100%;
      height: 100%;
      box-sizing: border-box;

      appearance: none;
      -webkit-appearance: none;
      outline: none;
      padding: 0;
      margin: 0;
      display: block;
      cursor: pointer;

      /* Smooth rounded corners */
      border-radius: 22px;

      /* Solid Near-Black Neutral Dark Gray (No blue tint) */
      background-color: #121212;

      /* Ultra-thin 0.5px Mid-Gray Border */
      border: 0.5px solid #555555;

      box-shadow: none;

      /* Touch Feedback */
      transition: transform 0.12s ease, background-color 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* Tactile press state */
    .dark-gray-button:active {
      transform: scale(0.985);
      background-color: #000000;
      border-color: #777777;
    }

    .dark-gray-button:focus {
      outline: none;
    }
  </style>
</head>
<body>

  <button class="dark-gray-button" type="button" onclick="buttonPressed()"></button>

  <script>
    function buttonPressed() {
      // Your action here
    }
  </script>
</body>
</html>
